<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Profile placeholder image</title>
  <desc id="desc">A simple blue gradient placeholder used when the profile image is unavailable.</desc>
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
  </defs>
  <rect width="1200" height="1200" fill="url(#grad)" />
  <circle cx="600" cy="500" r="260" fill="rgba(255,255,255,0.08)" />
  <rect x="325" y="720" width="550" height="170" rx="30" fill="rgba(255,255,255,0.08)" />
  <text x="600" y="580" fill="#e2e8f0" font-family="Inter, sans-serif" font-size="72" text-anchor="middle" font-weight="700">Profile Image</text>
  <text x="600" y="660" fill="#94a3b8" font-family="Inter, sans-serif" font-size="34" text-anchor="middle">Placeholder asset</text>
</svg>
